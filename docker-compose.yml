# Call Center Albarq — full stack orchestration.
# Services: MySQL, Redis, backend (Node/Express/Prisma), frontend (Vite build via nginx).
# Public demo mode runs entirely on the in-process mock Asterisk simulator —
# no real Asterisk/TG400 credentials required.

services:
  mysql:
    image: mysql:8.0
    container_name: albarq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: callcenter
      MYSQL_USER: albarq
      MYSQL_PASSWORD: '@Cs5.01998'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ualbarq", "-p@Cs5.01998"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: albarq-redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: albarq-backend
    restart: unless-stopped
    pid: host
    privileged: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "mysql://albarq:%40Cs5.01998@mysql:3306/callcenter"
      JWT_SECRET: 9571d3eb6aa3d565b67adfad5f7374e87675f8ec674e4bc190bd182eda6f5f5f8dc4884f0ff1efa980d36fc5bb86791f
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      DEMO_MODE: "false"
      ASTERISK_MODE: live
      AMI_HOST: 172.17.0.1
      AMI_PORT: 5038
      AMI_USER: albarq
      INTERNAL_CALLER_TOKEN: ${INTERNAL_CALLER_TOKEN}
      AMI_PASSWORD: rwSY5LCgoZpY9c8O1YQ/NaglnuEjuzsX7fWTlnWbnYc=
      SEED_ON_START: "false"
      EXTERNAL_MSSQL_ENABLED: "true"
      EXTERNAL_MSSQL_HOST: "192.168.0.25"
      EXTERNAL_MSSQL_PORT: "1434"
      EXTERNAL_MSSQL_DATABASE: "mynet"
      EXTERNAL_MSSQL_USER: "callcenter_sync"
      EXTERNAL_MSSQL_PASSWORD: "Itech@@1122"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./uploads:/app/uploads
      - /var/spool/asterisk/monitor:/var/spool/asterisk/monitor:ro
      - /var/lib/asterisk/sounds/custom:/var/lib/asterisk/sounds/custom:rw
      - /var/lib/asterisk/moh:/var/lib/asterisk/moh:rw
      - /etc/asterisk:/etc/asterisk:rw
      - /var/run/asterisk:/var/run/asterisk:rw
      - /opt/scripts:/opt/scripts:rw
      - /etc/ppp:/etc/ppp:rw
      - /etc/xl2tpd:/etc/xl2tpd:rw
      - /etc/swanctl:/etc/swanctl:rw

  frontend:
    build: ./frontend
    container_name: albarq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
